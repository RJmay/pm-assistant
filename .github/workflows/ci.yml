name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # The DB tests need a live Postgres + RLS policies. Boot the local Supabase
      # stack via the project-local CLI; ubuntu-latest has Docker preinstalled.
      - name: Start Supabase
        run: pnpm exec supabase start

      - name: Test
        env:
          RUN_DB_TESTS: "1"
        run: pnpm -r test

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
