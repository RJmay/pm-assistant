name: CI

on:
  push:
    branches: ["**"]
    # Docs-only changes don't need CI or a redeploy.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:

# PUBLIC_* are non-secret by design (the anon/publishable key ships in the client
# bundle; the URLs are public). They're needed so the web app's
# `$env/static/public` resolves during typecheck and the production build.
env:
  PUBLIC_SUPABASE_URL: https://deisxzmquxjaovubosil.supabase.co
  PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IqHklOQ33cHInvn3dK0AFQ_--HhLwuU
  PUBLIC_WORKER_URL: https://pm-assistant-worker.ryanmay065.workers.dev
  PUBLIC_ENVIRONMENT: production

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # The DB tests need a live Postgres + RLS policies. Boot the local Supabase
      # stack via the project-local CLI; ubuntu-latest has Docker preinstalled.
      - name: Start Supabase
        run: pnpm exec supabase start

      - name: Test
        env:
          RUN_DB_TESTS: "1"
        run: pnpm -r test

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  # Auto-deploy on pushes to main, only after CI passes. Worker secrets persist
  # on the deployed Worker (set via `wrangler secret put`), so deploy only ships
  # code + bindings — it never touches them.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter worker exec wrangler deploy

      - name: Build dashboard
        run: pnpm --filter web build

      # Cloudflare Pages only treats `pages deploy --branch X` as a PRODUCTION
      # deploy when X equals the project's configured production branch. If it
      # doesn't, the deploy silently lands as a *preview* (main.<project>.pages.dev)
      # while the apex (<project>.pages.dev) keeps serving a stale build — the
      # deploy still goes green, so the drift is invisible. Enforce main ==
      # production branch (idempotent) so every deploy updates the apex.
      - name: Ensure Pages production branch is "main"
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pm-assistant-web"
          current=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" | jq -r '.result.production_branch')
          echo "Pages production branch is currently: $current"
          if [ "$current" != "main" ]; then
            echo "Setting production branch to 'main'…"
            resp=$(curl -fsS -X PATCH "$api" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"production_branch":"main"}')
            [ "$(echo "$resp" | jq -r '.success')" = "true" ] || { echo "PATCH failed: $resp"; exit 1; }
          fi

      - name: Deploy dashboard (Cloudflare Pages — production)
        run: pnpm --filter worker exec wrangler pages deploy ../web/.svelte-kit/cloudflare --project-name pm-assistant-web --branch main

      # Fail loudly if the deploy didn't actually become the production deployment,
      # so a stale apex can never hide behind a green deploy again.
      - name: Verify the deploy went live on the production apex
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pm-assistant-web/deployments?per_page=1"
          env=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" | jq -r '.result[0].environment')
          echo "Newest Pages deployment environment: $env"
          if [ "$env" != "production" ]; then
            echo "::error::Newest Pages deployment is '$env', not 'production' — the apex (pm-assistant-web.pages.dev) will be stale."
            exit 1
          fi
